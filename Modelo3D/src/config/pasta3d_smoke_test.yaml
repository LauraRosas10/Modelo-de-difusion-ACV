# Tiny config to verify the whole 3D pipeline in seconds on CPU (synthetic data from tests/make_synthetic_h5.py)
volume_size: [32, 32, 6]
patch_size: [16, 16, 6]
lesion_patch_prob: 0.5
lesion_weight: 50.0
inplane_resize: true
random_flip: false
num_workers: 0
dims: 3
model_in_channels: 1
out_channels_model: 1
encoder_in_channels: 1
out_channels_encoder: 1
unet_dim: 32
num_res_blocks: 1
attention_resolutions: [2]
attention_type_3d: project_excite
num_heads: 2
unet_dim_mults: [1, 2]
dropout: 0
cond_emb_channels: 128
resblock_updown: true
use_time_condition: true
use_checkpoint: true
tab_cond_dim: 9
use_tabular_cond_model: condition
use_tabular_cond_encoder: null
tabular_cond: true
with_attention: true
cond_apply_method: 'ada'
timestep_respacing: ddim4
beta_schedule: cosine
timesteps: 20
objective: START_X
model_var_type: FIXED_LARGE
gen_type: ddim
condition: true
loss_type: l1
reconstructed_loss: l1
recon_weight: 0.1
rescale_intensity: true
data_dir: "/tmp/syn/"
train_batch_size: 1
train_lr: !!float 1e-3
weight_decay: !!float 1e-6
lr_scheduler: warmup_cosine
warmup_steps: 2
min_lr_ratio: 0.1
early_stopping_patience: 50
early_stopping_min_delta: !!float 1e-6
reset_patience_on_resume: true
train_num_steps: 4
save_and_sample_every: 2
max_val_volumes: 2
num_samples: 16
gradient_accumulate_every: 2
ema_decay: 0.9
amp: false
fp16: false
calculate_fid: false
dataset: MRI2PET
ROI_mask: null
model_cycling: true
cycle_detach: true
dx_labels: ['ACV']
results_folder: "/tmp/syn_results/"
resume: null
pretrain: null
pretrain_inflate: center
test_batch_size: 1
eval_h5: valid.h5
output_voxel_size: [1.5, 1.5, 1.5]
eval_mode: false
synthesis: false
